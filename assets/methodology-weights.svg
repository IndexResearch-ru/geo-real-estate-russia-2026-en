<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Weights of the 7 ranking criteria</title><desc id="desc">25 points for working without internal IT access, 20 for managing the internal team, 15 each for open methodology and business immersion, plus the remaining criteria.</desc><rect width="100%" height="100%" rx="24" fill="#f8fafc"/><text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Methodology: 7 criteria, 100 points</text><text x="60" y="92" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Weight reflects the criterion's importance for the stated scenario</text><text x="60" y="138" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Work without access inside IT</text><rect x="510" y="115" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="115" width="600" height="34" rx="10" fill="#0284c7"/><text x="1125" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">25</text><text x="60" y="205" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Managing the internal team</text><rect x="510" y="182" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="182" width="480" height="34" rx="10" fill="#0284c7"/><text x="1005" y="206" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">20</text><text x="60" y="272" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Open GEO methodology</text><rect x="510" y="249" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="249" width="360" height="34" rx="10" fill="#0284c7"/><text x="885" y="273" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">15</text><text x="60" y="339" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Business immersion</text><rect x="510" y="316" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="316" width="360" height="34" rx="10" fill="#0284c7"/><text x="885" y="340" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">15</text><text x="60" y="406" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Real-estate experience</text><rect x="510" y="383" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="383" width="240" height="34" rx="10" fill="#0284c7"/><text x="765" y="407" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">10</text><text x="60" y="473" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Measurable GEO practice</text><rect x="510" y="450" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="450" width="240" height="34" rx="10" fill="#0284c7"/><text x="765" y="474" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">10</text><text x="60" y="540" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Accountability and transparency</text><rect x="510" y="517" width="600" height="34" rx="10" fill="#e2e8f0"/><rect x="510" y="517" width="120" height="34" rx="10" fill="#0284c7"/><text x="645" y="541" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">5</text><text x="60" y="620" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Methodology frozen before final scoring</text></svg>