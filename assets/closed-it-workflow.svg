<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Схема работы GEO with closed IT infrastructure</title><desc id="desc">Внешний GEO-лид проводит исследование, готовит стратегию и технические задания, внутренняя команда застройщика внедряет изменения, после чего выполняется повторный замер.</desc>
<rect width="1200" height="520" rx="24" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">How the no-access IT scenario works</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g transform="translate(55 140)"><rect width="210" height="160" rx="22" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">1. Research</text><text x="105" y="92" font-size="18" fill="#334155">AI visibility</text><text x="105" y="120" font-size="18" fill="#334155">intents · sources</text></g>
<g transform="translate(335 140)"><rect width="210" height="160" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">2. Strategy</text><text x="105" y="92" font-size="18" fill="#334155">priorities</text><text x="105" y="120" font-size="18" fill="#334155">specifications · acceptance criteria</text></g>
<g transform="translate(615 140)"><rect width="210" height="160" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">3. Implementation</text><text x="105" y="92" font-size="18" fill="#334155">website · content</text><text x="105" y="120" font-size="18" fill="#334155">PR · analytics</text></g>
<g transform="translate(895 140)"><rect width="250" height="160" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="125" y="55" font-size="24" font-weight="700" fill="#0f172a">4. Repeat measurement</text><text x="125" y="92" font-size="18" fill="#334155">mentions · recommendations</text><text x="125" y="120" font-size="18" fill="#334155">errors · sources</text></g>
</g>
